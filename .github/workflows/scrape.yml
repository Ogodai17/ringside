name: Scrape Fight Cards

on:
  # Daily at 10:00 UTC (3am Pacific) — catches Friday ONE and Saturday UFC
  # results the next morning. Betting locks at event start regardless.
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:
  # Rebuild pages right away when settings or templates change
  # (scrapers are skipped on these runs)
  push:
    branches: [main]
    paths:
      - site_config.json
      - "templates/**"
      - "scraper/**"
      - "tests/**"
      - "supabase/**"

permissions:
  contents: write
  pages: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Each scraper keeps the previous data file if it finds 0 events,
      # and one failing doesn't stop the other.
      - name: Scrape ONE Championship
        id: one
        if: github.event_name != 'push'
        continue-on-error: true
        run: python scraper/scrape.py --out data --enrich --max 4

      - name: Scrape UFC
        id: ufc
        if: github.event_name != 'push'
        continue-on-error: true
        run: python scraper/scrape_ufc.py --out data --enrich --max-upcoming 4 --max-completed 2

      - name: Set odds from fighter records
        run: python scraper/odds.py data/events.json data/ufc_events.json

      - name: Build pages from site_config.json
        run: python scraper/build_pages.py

      - name: Generate fight previews + sitemap (all promotions, one pass)
        run: python scraper/generate_previews.py --data data/events.json data/ufc_events.json --out previews

      # Post this week's cards and fresh results to Discord (feed only, no
      # picks). Needs the DISCORD_WEBHOOKS repository secret; skips without it.
      # The feed's own test runs first so a broken feed never posts junk.
      - name: Test Discord feed
        id: feedtest
        if: github.event_name != 'push'
        continue-on-error: true
        run: python tests/discord_feed_test.py

      - name: Post to Discord
        id: feed
        if: github.event_name != 'push' && steps.feedtest.outcome == 'success'
        continue-on-error: true
        env:
          DISCORD_WEBHOOKS: ${{ secrets.DISCORD_WEBHOOKS }}
        run: python scraper/discord_feed.py

      - name: Commit updated site
        run: |
          git config user.name "Pick A Fight Bot"
          git config user.email "bot@pickafight.now"
          git add -A data/ previews/ sitemap.xml index.html about.html contact.html privacy.html 404.html manifest.webmanifest CNAME 2>/dev/null || git add -A data/ previews/ sitemap.xml index.html about.html contact.html privacy.html 404.html manifest.webmanifest
          git diff --staged --quiet || git commit -m "Update fight card data $(date -u +%Y-%m-%d)"
          git push

      # Push fights, odds and results into the database and settle picks.
      # Needs the SUPABASE_SECRET_KEY repository secret; skips cleanly without it.
      - name: Sync fights to database + settle picks
        id: sync
        continue-on-error: true
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python scraper/sync_db.py

      # Free Supabase projects pause after a week without traffic; one tiny
      # read a day keeps the community scorecard database awake.
      - name: Keep scorecard database awake
        continue-on-error: true
        run: |
          python - <<'EOF'
          import json, sys, urllib.request
          sys.path.insert(0, "scraper")
          import site_config
          api = site_config.db_api(site_config.load())
          if not api:
              print("scorecards not configured — skipping"); raise SystemExit
          h = {"apikey": api["key"], "Content-Type": "application/json"}
          if api["key"].startswith("eyJ"):
              h["Authorization"] = "Bearer " + api["key"]
          req = urllib.request.Request(api["url"] + "/rest/v1/rpc/score_summary", method="POST",
                                       data=json.dumps({"p_fights": ["fkeepalive"]}).encode(), headers=h)
          print("ping:", urllib.request.urlopen(req, timeout=20).status)
          EOF

      # Headless-Chrome stress test of the built site (42 checks). Runs after
      # the commit so a test problem never blocks fresh fight data.
      - name: Test site
        id: sitetest
        continue-on-error: true
        run: |
          pip install -q playwright
          python -m playwright install --with-deps chromium > /dev/null
          python tests/stress.py .

      # Turn the run red (GitHub emails you) if a scraper failed, after
      # everything else has been saved.
      - name: Flag scraper failures
        if: steps.one.outcome == 'failure' || steps.ufc.outcome == 'failure' || steps.sync.outcome == 'failure' || steps.sitetest.outcome == 'failure' || steps.feedtest.outcome == 'failure' || steps.feed.outcome == 'failure'
        run: |
          echo "::error::Failure — ONE scraper: ${{ steps.one.outcome }}, UFC scraper: ${{ steps.ufc.outcome }}, database sync: ${{ steps.sync.outcome }}, site test: ${{ steps.sitetest.outcome }}, Discord feed test: ${{ steps.feedtest.outcome }}, Discord post: ${{ steps.feed.outcome }}. Check the step logs above."
          exit 1

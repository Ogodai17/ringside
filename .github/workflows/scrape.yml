name: Scrape Fight Cards

on:
  # Daily at 10:00 UTC (3am Pacific) — catches Friday ONE and Saturday UFC
  # results the next morning. Betting locks at event start regardless.
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:
  # Rebuild pages right away when settings or templates change
  # (scrapers are skipped on these runs)
  push:
    branches: [main]
    paths:
      - site_config.json
      - "templates/**"
      - "scraper/**"
      - "tests/**"

permissions:
  contents: write
  pages: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Each scraper keeps the previous data file if it finds 0 events,
      # and one failing doesn't stop the other.
      - name: Scrape ONE Championship
        id: one
        if: github.event_name != 'push'
        continue-on-error: true
        run: python scraper/scrape.py --out data --enrich --max 4

      - name: Scrape UFC
        id: ufc
        if: github.event_name != 'push'
        continue-on-error: true
        run: python scraper/scrape_ufc.py --out data --enrich --max-upcoming 4 --max-completed 2

      - name: Build pages from site_config.json
        run: python scraper/build_pages.py

      - name: Generate fight previews + sitemap (all promotions, one pass)
        run: python scraper/generate_previews.py --data data/events.json data/ufc_events.json --out previews

      - name: Commit updated site
        run: |
          git config user.name "Ringside Bot"
          git config user.email "bot@ringside.dev"
          git add -A data/ previews/ sitemap.xml index.html about.html contact.html privacy.html CNAME 2>/dev/null || git add -A data/ previews/ sitemap.xml index.html about.html contact.html privacy.html
          git diff --staged --quiet || git commit -m "Update fight card data $(date -u +%Y-%m-%d)"
          git push

      # Headless-Chrome stress test of the built site (42 checks). Runs after
      # the commit so a test problem never blocks fresh fight data.
      - name: Test site
        id: sitetest
        continue-on-error: true
        run: |
          pip install -q playwright
          python -m playwright install --with-deps chromium > /dev/null
          python tests/stress.py .

      # Turn the run red (GitHub emails you) if a scraper failed, after
      # everything else has been saved.
      - name: Flag scraper failures
        if: steps.one.outcome == 'failure' || steps.ufc.outcome == 'failure' || steps.sitetest.outcome == 'failure'
        run: |
          echo "::error::Failure — ONE scraper: ${{ steps.one.outcome }}, UFC scraper: ${{ steps.ufc.outcome }}, site test: ${{ steps.sitetest.outcome }}. Check the step logs above."
          exit 1
